[package]
name = "jodel-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "The player's networks on the GPU, through wgpu: the stem separator, the beat network, the speech models, the cover's depth and cut-out, and the story's picture model"

[dependencies]
# The packed language model's file: whole or not at all, made durable.
durable = { path = "../durable" }
jodel-rhythm = { path = "../rhythm" }
jodel-lyrics = { path = "../lyrics" }
jodel-tensors = { path = "../tensors" }
pollster = "1.0.1"
# Vulkan on Windows and Linux, Metal on the Mac: no DirectX, WebGPU or
# GLES (the player's window takes the same).
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "wgsl"] }

# The card's memory budget through Vulkan's own calls (`VK_EXT_memory_budget`;
# Vulkan is not built on Apple's systems). The version is wgpu-hal's own: its
# instance is called with these types, so a wgpu update moves this with it.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ash = "0.38.0"

# The card's memory budget through Metal's own calls. The version is
# wgpu-hal's own (its device is queried with these types): moved with wgpu.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }

[dev-dependencies]
# Every file the tests and examples write: whole or not at all, made durable.
durable = { path = "../durable" }
hound = "3.5"
# The picture example's PNGs (references in, pictures out).
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The kernels checked through Metal's writer on any machine (wgpu's own
# naga).
naga = { version = "30.0.2", features = ["wgsl-in", "msl-out"] }
jodel-output = { path = "../output" }
jodel-playback = { path = "../playback" }

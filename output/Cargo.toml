[package]
name = "jodel-output"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Bit-perfect exclusive PCM output to audio devices (WASAPI, Core Audio HAL, ALSA hw)"

[dependencies]
# Every file written: whole or not at all, made durable.
durable = { path = "../durable" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Threading",
  "Win32_Security",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12.1"

[package]
name = "jodel-looks"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Karaoke mode's looks: shader passes as data, each with its maths on the processor, stacked by presets or a model, moved by the music, kept safe by guards"

[dependencies]
# The music the looks move with: the song's beats, waveforms and key.
jodel-rhythm = { path = "../rhythm" }
# The looks as data (what the model writes, the presets, the catalogue).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# A pass's numbers as the GPU reads them.
bytemuck = { version = "1.25.2", features = ["derive"] }

[dev-dependencies]
# The catalogue example writes the docs whole.
durable = { path = "../durable" }
# The contact sheets read the images and write PNGs.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# Every pass's shader held to its maths on the GPU (the testkit's compute
# runner), its pipeline made there.
jodel-testkit = { path = "../testkit", features = ["gpu"] }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "1.0.1"
# Every shader parsed and validated on any machine, GPU or not (wgpu's own
# naga).
naga = { version = "30.0.2", features = ["wgsl-in"] }

name: Build and test

# Every push builds and tests the workspace and bundles the player on each
# platform: Linux and macOS (Apple silicon only) natively, Windows (x64)
# cross-built on Linux (and its bundles run on Windows); the workspace is
# also tested on Windows. Every test binary runs, a failing one or not, so
# that a run shows every failure. A pushed tag starting with "v" (v0.0.1,
# v1.2.0-rc1) also publishes a GitHub release with the bundles for all four
# platforms (the jodeldiplom player, as "Jodeldiplom.app" on macOS); a tag
# with a hyphen is marked as a pre-release.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Minimum Rust versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install the ALSA headers (jodel-output on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      # Each crate is tested with the rust-version its own Cargo.toml declares:
      # durable, jodel-output, jodel-playback, jodel-rhythm and jodel-lyrics
      # keep an older one than jodel-gpu and the player. A crate failing
      # does not stop the others.
      - name: Test each crate with its rust-version
        run: |
          set -euo pipefail
          failed=()
          for manifest in durable/Cargo.toml output/Cargo.toml playback/Cargo.toml rhythm/Cargo.toml lyrics/Cargo.toml gpu/Cargo.toml player/Cargo.toml; do
            package=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
            version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' "$manifest")
            rustup toolchain install "$version" --profile minimal
            echo "::group::$package on Rust $version"
            cargo "+$version" test -p "$package" --locked --no-fail-fast || failed+=("$package")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "::error::Failed: ${failed[*]}"
            exit 1
          fi

  # The player's fonts (Sarasa Fixed J, Noto Emoji, Atkinson Hyperlegible
  # Next, and Karaoke mode's Nunito, Fredoka and M PLUS Rounded 1c) are
  # in the repository, in player/fonts.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
      BUILD_PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            platform: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: macos-arm64
            runner: macos-15
            platform: macos
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      # The player's Linux output (jodel-output) links ALSA, so its headers are
      # needed before the workspace compiles.
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      # Each check runs whether the one before passed or not, and so does
      # the bundle: a run shows every failure at once.
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run the tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build and stage the bundle
        id: bundle
        if: ${{ !cancelled() }}
        run: bash scripts/bundle.sh "$RUNNER_TEMP/build" "$BUILD_PLATFORM"
      - name: Run the staged player
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          set -euo pipefail
          bundle=$RUNNER_TEMP/build/jodeldiplom-$BUILD_PLATFORM
          if [[ $BUILD_PLATFORM == macos ]]; then
            # The player is an app: signed (ad hoc), with its icon, and
            # nothing beside it in bin.
            app="$bundle/Jodeldiplom.app"
            test ! -e "$bundle/bin"
            plutil -lint "$app/Contents/Info.plist"
            codesign --verify --strict "$app"
            test -s "$app/Contents/Resources/jodeldiplom.icns"
            player="$app/Contents/MacOS/jodeldiplom"
          else
            # One binary in bin.
            test "$(ls "$bundle/bin")" = jodeldiplom
            player="$bundle/bin/jodeldiplom"
          fi
          "$player" --list-devices
          # Its fonts are built in.
          "$player" --help | grep -F "Sarasa Fixed J (built in), emoji: Noto Emoji (built in)"
      - name: Package the bundle
        env:
          ARTIFACT: jodeldiplom-${{ matrix.name }}.tar.gz
        run: tar -C "$RUNNER_TEMP/build/jodeldiplom-$BUILD_PLATFORM" -czf "$RUNNER_TEMP/$ARTIFACT" .
      - uses: actions/upload-artifact@v6
        with:
          name: jodeldiplom-${{ matrix.name }}
          path: ${{ runner.temp }}/jodeldiplom-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  # The Windows x64 bundle, cross-built on Linux; its tests run on Windows
  # (windows-test), the bundle itself too (windows-smoke).
  windows-build:
    name: Build windows-x64
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install the Windows x64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - name: Build and stage the bundle
        run: bash scripts/bundle.sh "$RUNNER_TEMP/build" windows-x64
      - name: Package the bundle
        run: tar -C "$RUNNER_TEMP/build/jodeldiplom-windows-x64" -czf "$RUNNER_TEMP/jodeldiplom-windows-x64.tar.gz" .
      - uses: actions/upload-artifact@v6
        with:
          name: jodeldiplom-windows-x64
          path: ${{ runner.temp }}/jodeldiplom-windows-x64.tar.gz
          if-no-files-found: error

  # The workspace's checks and tests on Windows, with the toolchain the
  # README gives for it (GNU, MSYS2's UCRT64 on PATH): the WASAPI and MMCSS
  # code is linted and its tests run; no test needs an audio device.
  windows-test:
    name: Test on Windows x64
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v6
      - name: Install MSYS2's UCRT64 compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put the compiler on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy
      - name: Check lints
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run the tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: cargo test --workspace --locked --no-fail-fast

  windows-smoke:
    name: Run Windows x64 bundle
    needs: windows-build
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: jodeldiplom-windows-x64
          path: ${{ runner.temp }}/downloads
      - name: Run the Windows executables
        shell: pwsh
        env:
          ARTIFACT: jodeldiplom-windows-x64.tar.gz
        run: |
          $bundle = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/bundle"
          tar -xf "$env:RUNNER_TEMP/downloads/$env:ARTIFACT" -C $bundle.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # One binary in bin.
          $bin = Get-ChildItem "$($bundle.FullName)/bin"
          if ($bin.Count -ne 1 -or $bin[0].Name -ne 'jodeldiplom.exe') { exit 1 }
          $player = "$($bundle.FullName)/bin/jodeldiplom.exe"
          # Its fonts are built in (about 20 MB of it).
          if ((Get-Item $player).Length -lt 20MB) { exit 1 }
          # A window program (no console of its own): its output piped,
          # waited for. Hosted runners may have no audio service, so only
          # --help runs here; its fonts are built in.
          $help = & $player --help | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $help
          if (-not $help.Contains('Sarasa Fixed J (built in), emoji: Noto Emoji (built in)')) { exit 1 }
          exit 0

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msrv, build, windows-build, windows-test, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: jodeldiplom-*
          path: ${{ runner.temp }}/artifacts
      - name: Package the bundles and publish them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifacts=$RUNNER_TEMP/artifacts
          staging=$RUNNER_TEMP/staging
          release=$RUNNER_TEMP/release
          mkdir -p "$staging" "$release"
          # Each bundle unpacks into one folder named after the release and
          # platform: a zip for Windows and macOS (where it holds the app),
          # a gzipped tar for Linux.
          for platform in linux-x64 linux-arm64 macos-arm64 windows-x64; do
            name=jodeldiplom-$TAG-$platform
            mkdir "$staging/$name"
            tar -xzf "$artifacts/jodeldiplom-$platform/jodeldiplom-$platform.tar.gz" -C "$staging/$name"
            if [[ $platform == windows-* || $platform == macos-* ]]; then
              (cd "$staging" && zip -qry "$release/$name.zip" "$name")
            else
              tar -C "$staging" -czf "$release/$name.tar.gz" "$name"
            fi
          done
          (cd "$release" && sha256sum -- * > SHA256SUMS.txt)
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$release"/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes --verify-tag "${prerelease[@]}"

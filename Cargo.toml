# The player (its window) is in player/, its playback engine in
# playback/, the device output (shared, through the system's mixer), the
# mixer and the microphone in output/, its beat and tempo
# analysis and stem separation in rhythm/ (on the GPU in gpu/; the tools
# that make its pitch weights in rhythm/tools/), its lyrics
# for karaoke in lyrics/, the checkpoints the speech, depth and cut-out
# models are read from in tensors/, the synthesizer of the game's sound
# effects in synth/. Every file written goes through
# durable/ (whole or not at all, made durable).
# Resolver 3 picks dependency versions that build on each member's
# rust-version.
[workspace]
members = ["durable", "gpu", "lyrics", "output", "playback", "player", "rhythm", "rhythm/tools", "synth", "tensors"]
resolver = "3"

# The beat analysis runs long loops over whole tracks; its tests would take
# minutes unoptimized.
[profile.dev.package.jodel-rhythm]
opt-level = 3

# The same for the echo canceller's tests (seconds of a reverberant room);
# and the device thread it runs in is better quick in a debug build too.
[profile.dev.package.jodel-output]
opt-level = 3

# The playback engine's tests decode, resample and separate whole tracks,
# some of them on a device in real time: unoptimized, a loaded machine
# could not keep up.
[profile.dev.package.jodel-playback]
opt-level = 3

[package]
name = "jodel-playback"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Playback engine: FLAC, WAV, AIFF, CAF, ALAC, AAC, MP3 and Vorbis files to a device through the system's mixer, gapless"

[dependencies]
# Every file written: whole or not at all, made durable.
durable = { path = "../durable" }
jodel-output = { path = "../output" }
jodel-rhythm = { path = "../rhythm" }
symphonia = { version = "0.6", default-features = false, features = ["flac", "wav", "pcm", "aiff", "caf", "alac", "isomp4", "aac", "mp1", "mp2", "mp3", "ogg", "vorbis", "id3v1", "id3v2"] }

[features]
# `Command::Along`: the playing track read along a time map, as a
# transition reads its tracks, for this crate's tests.
test-support = []

[dev-dependencies]
hound = "3.5"
# The tests use `test-support`.
jodel-playback = { path = ".", features = ["test-support"] }
